<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b7bf7"/>
      <stop offset="1" stop-color="#14b8d4"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b3a7a" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- nền -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="420" cy="86" r="120" fill="#fff" opacity=".08"/>
  <circle cx="70" cy="470" r="140" fill="#fff" opacity=".06"/>
  <!-- cuốn sổ -->
  <g filter="url(#sh)">
    <rect x="128" y="96" width="248" height="312" rx="34" fill="#ffffff"/>
    <rect x="128" y="96" width="58" height="312" rx="29" fill="#e3edff"/>
    <rect x="160" y="96" width="26" height="312" fill="#e3edff"/>
    <!-- gáy lò xo -->
    <g fill="#3b7bf7">
      <rect x="112" y="140" width="44" height="18" rx="9"/>
      <rect x="112" y="200" width="44" height="18" rx="9"/>
      <rect x="112" y="260" width="44" height="18" rx="9"/>
      <rect x="112" y="320" width="44" height="18" rx="9"/>
    </g>
    <!-- dòng kẻ -->
    <g stroke="#c9d8f2" stroke-width="14" stroke-linecap="round">
      <line x1="214" y1="160" x2="336" y2="160"/>
      <line x1="214" y1="206" x2="316" y2="206"/>
    </g>
  </g>
  <!-- dấu tích điểm danh -->
  <g filter="url(#sh)">
    <circle cx="330" cy="330" r="92" fill="url(#ok)" stroke="#fff" stroke-width="14"/>
    <path d="M286 332 l30 30 l58 -62" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
